name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_queue:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality checks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Coverage check
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: E2E tests (Chromium + Pixel 5)
        run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    name: Security audit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: protect
